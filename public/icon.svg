<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente principal do fundo (Grafite para Verde-Petróleo) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Brilho ambiente suave no topo -->
    <radialGradient id="topGlow" cx="72%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0f766e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Brilho quente atrás do pino de destino -->
    <radialGradient id="pinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Gradiente do pino de GPS (Âmbar / Dourado) -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Gradiente da rota na estrada -->
    <linearGradient id="roadGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#5eead4" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#fde047" stop-opacity="1" />
    </linearGradient>

    <!-- Sombra suave para profundidade -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.45" />
    </filter>

    <!-- Recorte arredondado padrão de app mobile -->
    <clipPath id="roundedIcon">
      <rect width="512" height="512" rx="116" />
    </clipPath>
  </defs>

  <g clip-path="url(#roundedIcon)">
    <!-- Fundo base + iluminação -->
    <rect width="512" height="512" fill="url(#bgGrad)" />
    <rect width="512" height="512" fill="url(#topGlow)" />

    <!-- Linhas topográficas sutis (textura de mapa rodoviário) -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3">
      <path d="M -40 120 Q 120 40, 260 110 T 560 70" />
      <path d="M -40 240 Q 150 170, 310 230 T 560 190" />
      <path d="M -40 370 Q 160 310, 340 360 T 560 330" />
      <circle cx="332" cy="176" r="105" />
      <circle cx="332" cy="176" r="165" />
    </g>

    <!-- Halo de luz do destino -->
    <circle cx="332" cy="172" r="95" fill="url(#pinGlow)" />

    <!-- Estrada / Trajeto em curva suave -->
    <path
      d="M 88 338 C 125 235, 238 292, 272 232 C 292 198, 305 186, 332 184"
      fill="none"
      stroke="#042f2e"
      stroke-opacity="0.55"
      stroke-width="34"
      stroke-linecap="round"
    />
    <path
      d="M 88 338 C 125 235, 238 292, 272 232 C 292 198, 305 186, 332 184"
      fill="none"
      stroke="url(#roadGrad)"
      stroke-width="20"
      stroke-linecap="round"
    />
    <!-- Faixa central pontilhada da rota -->
    <path
      d="M 96 334 C 130 238, 238 290, 272 232 C 290 202, 304 188, 326 185"
      fill="none"
      stroke="#ffffff"
      stroke-width="4"
      stroke-linecap="round"
      stroke-dasharray="10 14"
      stroke-opacity="0.95"
    />

    <!-- Ponto de partida (Origem) -->
    <circle cx="88" cy="338" r="14" fill="#0f172a" stroke="#5eead4" stroke-width="6" />
    <circle cx="88" cy="338" r="5" fill="#ffffff" />

    <!-- Pino de GPS moderno (Destino) -->
    <g filter="url(#softShadow)">
      <path
        d="M 332 76 C 288 76, 254 110, 254 154 C 254 206, 320 264, 328 271 C 330.5 273.2, 333.5 273.2, 336 271 C 344 264, 410 206, 410 154 C 410 110, 376 76, 332 76 Z"
        fill="url(#pinGrad)"
      />
      <!-- Centro do pino -->
      <circle cx="332" cy="152" r="30" fill="#0f172a" />
      <circle cx="332" cy="152" r="13" fill="#fde047" />
    </g>

    <!-- Estrela de IA (Gemini Copiloto) ao lado do pino -->
    <path
      d="M 426 86 Q 428 106, 448 108 Q 428 110, 426 130 Q 424 110, 404 108 Q 424 106, 426 86 Z"
      fill="#fef08a"
      opacity="0.95"
    />
    <path
      d="M 218 112 Q 219 122, 229 123 Q 219 124, 218 134 Q 217 124, 207 123 Q 217 122, 218 112 Z"
      fill="#99f6e4"
      opacity="0.85"
    />

    <!-- Faixa inferior sutil para legibilidade do nome -->
    <rect x="0" y="348" width="512" height="164" fill="#020617" fill-opacity="0.28" />

    <!-- Monograma NKZ + selo PRO -->
    <g filter="url(#softShadow)">
      <text
        x="212"
        y="444"
        text-anchor="middle"
        fill="#ffffff"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-weight="900"
        font-size="112"
        letter-spacing="4"
      >NKZ</text>

      <!-- Selo PRO em âmbar -->
      <rect x="342" y="388" width="96" height="44" rx="14" fill="url(#pinGrad)" />
      <text
        x="390"
        y="418"
        text-anchor="middle"
        fill="#0f172a"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-weight="900"
        font-size="25"
        letter-spacing="1.5"
      >PRO</text>
    </g>

    <!-- Reflexo de vidro sutil na borda interna -->
    <rect
      x="6"
      y="6"
      width="500"
      height="500"
      rx="110"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.14"
      stroke-width="4"
    />
  </g>
</svg>
